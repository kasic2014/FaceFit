name: Deploy FaceFit project

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Private server via Public server (bastion) and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRIVATE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          proxy_host: ${{ secrets.PUBLIC_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/FaceFit
            cd ~/FaceFit
            if [ ! -d .git ]; then
              git clone https://github.com/kasic2014/FaceFit.git .
            fi
            git fetch --all
            git checkout main
            git reset --hard origin/main
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            docker compose --env-file .env -f infra/compose/compose.dev.yml down 2>/dev/null || docker-compose --env-file .env -f infra/compose/compose.dev.yml down 2>/dev/null || docker-compose -f docker-compose.dev.yml down 2>/dev/null || true
            docker compose --env-file .env -f infra/compose/compose.dev.yml up -d --build 2>/dev/null || docker-compose --env-file .env -f infra/compose/compose.dev.yml up -d --build 2>/dev/null || docker-compose -f docker-compose.dev.yml up -d --build
            docker ps -a

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Public server and redeploy frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PUBLIC_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/FaceFit
            cd ~/FaceFit
            if [ ! -d .git ]; then
              git clone https://github.com/kasic2014/FaceFit.git .
            fi
            git fetch --all
            git checkout main
            git reset --hard origin/main
            docker rm -f facefit-frontend 2>/dev/null || true
            docker build --no-cache \
              -t facefit-frontend:latest \
              ./frontend
            docker run -d \
              --name facefit-frontend \
              -p 80:80 \
              -p 443:443 \
              -e DOMAIN='${{ secrets.DOMAIN }}' \
              -e BACKEND_HOST='${{ secrets.BACKEND_HOST }}' \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --restart unless-stopped \
              facefit-frontend:latest
            docker ps --filter name=facefit-frontend
            docker logs --tail 50 facefit-frontend
