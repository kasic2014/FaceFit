name: AI Analysis Server Test

on:
  push:
    paths:
      - 'ai-server/analysis-server/**'
      - 'ai-server/openapi/**'
      - '.github/workflows/ai-analysis-test.yml'
  pull_request:
    paths:
      - 'ai-server/analysis-server/**'
      - 'ai-server/openapi/**'
      - '.github/workflows/ai-analysis-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            ai-server/analysis-server/requirements.txt
            ai-server/analysis-server/requirements-cpu.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgles2 libgl1-mesa-glx libegl1-mesa
      - name: Install dependencies
        working-directory: ai-server/analysis-server
        run: |
          python -m pip install -r requirements-cpu.txt
          python -m pip uninstall --yes opencv-contrib-python
          python -m pip install --no-deps --force-reinstall opencv-contrib-python-headless==5.0.0.93
          python scripts/download_cv_models.py --output models
      - name: Run internal AI HTTP contract tests
        working-directory: ai-server/analysis-server
        run: >-
          python -m unittest
          tests.test_analysis_http_api
          tests.test_analysis_api_settings
          tests.test_stt_http_analyzer
          tests.test_cv_analyzer
          tests.test_media_download
          -v
