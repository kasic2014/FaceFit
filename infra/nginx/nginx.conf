events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location /api/v1/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ai/analysis/ {
            proxy_pass http://analysis-server:8001/;
        }

        location /ai/vision/ {
            proxy_pass http://vision-server:8002/;
        }

        location /ai/tts/ {
            proxy_pass http://tts-server:8003/;
        }
    }
}
