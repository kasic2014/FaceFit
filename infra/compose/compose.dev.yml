version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local

  analysis-server:
    build:
      context: ../..
      dockerfile: infra/docker/analysis-server.Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENV=development

  vision-server:
    build:
      context: ../..
      dockerfile: infra/docker/vision-server.Dockerfile
    ports:
      - "8002:8002"
    environment:
      - ENV=development

  tts-server:
    build:
      context: ../..
      dockerfile: infra/docker/tts-server.Dockerfile
    ports:
      - "8003:8003"
    environment:
      - ENV=development

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
