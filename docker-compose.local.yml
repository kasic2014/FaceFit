name: face-fit-ai

services:
  vision-server:
    build:
      context: ./ai-server/vision-server
      dockerfile: Dockerfile
    container_name: face-fit-vision-server
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      VISION_API_ENV: "development"
      VISION_API_HOST: "0.0.0.0"
      VISION_API_PORT: "8000"
      VISION_API_ALLOWED_ORIGINS: ""
      VISION_API_ENABLE_DOCS: "true"
      VISION_API_OUTPUT_ROOT: "/app/data/output"
      VISION_API_LOG_LEVEL: "INFO"
    volumes:
      - ./ai-server/vision-server/data/output:/app/data/output
      - ./ai-server/vision-server/data/pilot/incoming:/app/data/pilot/incoming:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - face-fit-ai-network

  analysis-server:
    build:
      context: ./ai-server/analysis-server
      dockerfile: Dockerfile
    image: face-fit-analysis-server:local
    container_name: face-fit-analysis-server
    init: true
    ports:
      - "8002:8002"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HOME: "/models/faster-whisper"
      HF_HUB_OFFLINE: "1"
      ANALYSIS_API_ENV: "development"
      ANALYSIS_API_HOST: "0.0.0.0"
      ANALYSIS_API_PORT: "8002"
      ANALYSIS_API_ALLOWED_ORIGINS: ""
      ANALYSIS_API_ENABLE_DOCS: "true"
      ANALYSIS_API_OUTPUT_ROOT: "/app/data/output"
      ANALYSIS_API_LOG_LEVEL: "INFO"
      ANALYSIS_API_EXPOSE_TRANSCRIPT_TEXT: "true"
      ANALYSIS_API_JOB_MAX_WORKERS: "1"
      ANALYSIS_API_JOB_QUEUE_CAPACITY: "16"
      ANALYSIS_API_JOB_LOCK_WAIT_SECONDS: "300"
      ANALYSIS_API_STALE_LOCK_SECONDS: "900"
      ANALYSIS_API_SHUTDOWN_WAIT_SECONDS: "30"
      ANALYSIS_API_JOB_RETENTION_ENABLED: "false"
      ANALYSIS_API_JOB_RETENTION_DAYS: "30"
      ANALYSIS_API_JOB_MAX_RECORDS: "1000"
    volumes:
      - ./ai-server/analysis-server/data/output:/app/data/output
      - ${FACEFIT_STT_MODEL_CACHE_HOST:-./ai-server/analysis-server/models/faster-whisper-cache}:/models/faster-whisper:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - face-fit-ai-network

networks:
  face-fit-ai-network:
    name: face-fit-ai-network
