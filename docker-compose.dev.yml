version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: facefit-backend-dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SUPABASE_JWT_ISSUER_URI=${SUPABASE_JWT_ISSUER_URI}
    restart: always

  analysis-server:
    build:
      context: .
      dockerfile: infra/docker/analysis-server.Dockerfile
    container_name: facefit-analysis-server-dev
    ports:
      - "8001:8001"
    environment:
      - ENV=development
    restart: always

  vision-server:
    build:
      context: .
      dockerfile: infra/docker/vision-server.Dockerfile
    container_name: facefit-vision-server-dev
    ports:
      - "8002:8002"
    environment:
      - ENV=development
    restart: always

  tts-server:
    build:
      context: .
      dockerfile: infra/docker/tts-server.Dockerfile
    container_name: facefit-tts-server-dev
    ports:
      - "8003:8003"
    environment:
      - ENV=development
    restart: always
