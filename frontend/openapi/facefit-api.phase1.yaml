                properties:
                  axis: { type: string, enum: [GAZE, POSTURE, SPEECH, CONTENT] }
                  title: { type: string }
                  description: { type: string }
                  evidence: { type: array, items: { $ref: '#/components/schemas/ReportEvidence' } }
            improvements: { type: array, items: { $ref: '#/components/schemas/ReportImprovement' } }
