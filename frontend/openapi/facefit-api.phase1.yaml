          anyOf: [{ $ref: '#/components/schemas/MemberSummary' }, { type: 'null' }]
        nextAction: { $ref: '#/components/schemas/NextAction' }
    ApiEnvelopeBase:
      type: object
      required: [success, code, message, requestId, timestamp]
