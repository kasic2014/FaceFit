        totalAnswerCount: { type: integer, minimum: 0 }
        completedAnswerCount: { type: integer, minimum: 0 }
        failedAnswerCount: { type: integer, minimum: 0 }
        totalRequiredTaskCount: { type: integer, minimum: 0 }
        succeededRequiredTaskCount: { type: integer, minimum: 0 }
