        application/json:
          schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' }
    PlaybackAccessSuccess:
      description: Opaque media playback access
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlaybackAccessEnvelope' }
    CurrentQuestionSuccess:
      description: Current question or question generation state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CurrentQuestionEnvelope' }
    InterviewAnswerSuccess:
      description: Interview answer status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InterviewAnswerEnvelope' }
    QuestionContextSuccess:
      description: Question generation evidence summaries
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QuestionContextEnvelope' }
    CareerDocumentPageSuccess:
      description: Career document page
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CareerDocumentPageEnvelope' }
    ResumeInterviewProfileSummarySuccess:
      description: Sanitized resume interview profile
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResumeInterviewProfileSummaryEnvelope' }
    JobPostingPageSuccess:
      description: Job posting page
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobPostingPageEnvelope' }
