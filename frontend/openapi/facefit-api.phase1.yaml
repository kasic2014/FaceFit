              properties:
                gaze: { type: number, minimum: 0, maximum: 100 }
                posture: { type: number, minimum: 0, maximum: 100 }
                speech: { type: [number, 'null'], minimum: 0, maximum: 100 }
                content: { type: number, minimum: 0, maximum: 100 }
            strengths:
              type: array
              items:
                type: object
                required: [axis, title, description, evidence]
