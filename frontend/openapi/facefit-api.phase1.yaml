        qualifications: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        preferredQualifications: { type: array, items: { type: string, minLength: 1 } }
        technologiesTools: { type: array, items: { type: string, minLength: 1 } }
        coreCompetencies: { type: array, items: { type: string, minLength: 1 } }
