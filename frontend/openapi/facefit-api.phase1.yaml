  schemas:
    Uuid: { type: string, format: uuid }
    IsoDateTime: { type: string, format: date-time }
    MemberStatus: { type: string, enum: [ACTIVE, BLOCKED, WITHDRAWN] }
    OnboardingStatus: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED] }
    NextAction: { type: string, enum: [COMPLETE_ONBOARDING, GO_TO_SERVICE, RELOGIN] }
    MemberSummary:
      type: object
      required: [memberId, name, email, profileImageUrl, memberStatus, onboardingStatus, createdAt]
      additionalProperties: false
      properties:
        memberId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        email: { type: string, format: email }
        profileImageUrl: { type: [string, 'null'], format: uri }
        memberStatus: { $ref: '#/components/schemas/MemberStatus' }
        onboardingStatus: { $ref: '#/components/schemas/OnboardingStatus' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    AuthData:
      type: object
