        reportStatus: { type: string, enum: [WAITING_FOR_ANALYSIS, QUEUED, PROCESSING, SUCCEEDED, FAILED] }
        failureCode: { type: [string, 'null'], enum: [ANSWER_ANALYSIS_FAILED, BLOCKED_BY_ANALYSIS_FAILURE, REPORT_GENERATION_FAILED, null] }
        retryable: { type: boolean }
