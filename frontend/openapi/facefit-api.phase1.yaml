openapi: 3.1.0
info:
  title: FaceFit API - Phase 1
  version: 0.3.6
  description: Authentication and account-onboarding contract extracted from FaceFit API specification v0.3.6.
servers:
  - url: '{apiBaseUrl}'
    variables:
      apiBaseUrl:
        default: http://localhost:8080
paths:
  /oauth2/authorization/{provider}:
    get:
      operationId: startOAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, kakao, naver] }
      responses:
        '302': { description: Redirect to OAuth provider }
  /login/oauth2/code/{provider}:
    get:
      operationId: completeOAuthCallback
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, kakao, naver] }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        '303': { description: Redirect to frontend callback with a one-time login ticket }
  /api/v1/auth/oauth/exchange:
    post:
      operationId: exchangeOAuthLoginTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginTicket]
              additionalProperties: false
              properties:
                loginTicket: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/token/refresh:
    post:
      operationId: refreshAuthSession
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Refresh cookie expired }
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
  /api/v1/legal-documents:
    get:
      operationId: listLegalDocuments
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/LegalDocumentType' }
      responses:
        '200':
          description: Active legal documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentListEnvelope' }
  /api/v1/legal-documents/{documentId}:
    get:
      operationId: getLegalDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Legal document detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentDetailEnvelope' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/members/me/onboarding:
    patch:
      operationId: completeAccountOnboarding
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalActions, voiceAnalysisConsent]
              additionalProperties: false
              properties:
                voiceAnalysisConsent: { type: boolean }
                legalActions:
                  type: array
                  items:
                    type: object
                    required: [documentId, actionType]
                    additionalProperties: false
                    properties:
                      documentId: { $ref: '#/components/schemas/Uuid' }
                      actionType: { $ref: '#/components/schemas/LegalActionType' }
      responses:
        '200':
          description: Onboarding complete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingCompletionEnvelope' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/career-documents:
    get:
      operationId: listCareerDocuments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: documentType
          in: query
          schema: { type: string, enum: [RESUME, COVER_LETTER] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProcessingStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/CareerDocumentPageSuccess' }
    post:
      operationId: createCareerDocument
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, documentType]
              properties:
                file: { type: string, format: binary }
                documentType: { const: RESUME }
      responses:
        '202': { $ref: '#/components/responses/CareerDocumentSuccess' }
  /api/v1/career-documents/{documentId}:
    get:
      operationId: getCareerDocument
      security: [{ bearerAuth: [] }]
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/CareerDocumentSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteCareerDocument
      security: [{ bearerAuth: [] }]
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '204': { description: Career document deleted }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/career-documents/{documentId}/analysis:
    get:
      operationId: getCareerDocumentAnalysis
      security: [{ bearerAuth: [] }]
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/ResumeInterviewProfileSummarySuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/job-postings:
    get:
      operationId: listJobPostings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: processingStatus
          in: query
          schema: { $ref: '#/components/schemas/ProcessingStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/JobPostingPageSuccess' }
    post:
      operationId: createJobPosting
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [inputType, targetJobRole, file]
              properties:
                inputType: { const: FILE }
                targetJobRole: { $ref: '#/components/schemas/AiJobRole' }
                file: { type: string, format: binary }
      responses:
        '202': { $ref: '#/components/responses/JobPostingSuccess' }
  /api/v1/job-postings/{jobPostingId}:
    get:
      operationId: getJobPosting
      security: [{ bearerAuth: [] }]
      parameters:
        - name: jobPostingId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/JobPostingSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
    patch:
      operationId: updateJobPosting
      security: [{ bearerAuth: [] }]
      parameters:
        - name: jobPostingId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobPostingUpdate' }
      responses:
        '200': { $ref: '#/components/responses/JobPostingSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteJobPosting
      security: [{ bearerAuth: [] }]
      parameters:
        - name: jobPostingId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '204': { description: Job posting deleted }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions:
    post:
      operationId: createInterviewSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resumeDocumentId, coverLetterDocumentId, jobPostingId, persona, difficulty]
              additionalProperties: false
              properties:
                resumeDocumentId: { $ref: '#/components/schemas/Uuid' }
                coverLetterDocumentId: { type: [string, 'null'], format: uuid }
                jobPostingId: { $ref: '#/components/schemas/Uuid' }
                persona: { $ref: '#/components/schemas/Persona' }
                difficulty: { $ref: '#/components/schemas/Difficulty' }
      responses:
        '201': { $ref: '#/components/responses/InterviewSessionSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}:
    get:
      operationId: getInterviewSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/InterviewSessionSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
    patch:
      operationId: updateInterviewSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewSessionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/InterviewSessionSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/start:
    post:
      operationId: startInterviewSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { $ref: '#/components/responses/InterviewSessionSuccess' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/completion:
    post:
      operationId: completeInterviewSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completionType]
              additionalProperties: false
              properties:
                completionType: { type: string, enum: [NORMAL, USER_INTERRUPTED] }
      responses:
        '200': { $ref: '#/components/responses/InterviewSessionSuccess' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/questions/current:
    get:
      operationId: getCurrentQuestion
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/CurrentQuestionSuccess' }
        '202': { $ref: '#/components/responses/CurrentQuestionSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/questions/{questionId}/character-media-access:
    post:
      operationId: createQuestionCharacterMediaAccess
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: questionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/PlaybackAccessSuccess' }
        '202': { $ref: '#/components/responses/ReportProcessingSuccess' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/answers:
    post:
      operationId: createInterviewAnswer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [questionId, file, recordedDurationMs, endedBy]
              properties:
                questionId: { $ref: '#/components/schemas/Uuid' }
                file: { type: string, format: binary }
                recordedDurationMs: { type: integer, minimum: 1000, maximum: 300000 }
                endedBy: { type: string, enum: [USER_BUTTON, SPACE_KEY, SILENCE_CONFIRMED] }
      responses:
        '202': { $ref: '#/components/responses/InterviewAnswerSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-answers/{answerId}:
    get:
      operationId: getInterviewAnswer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: answerId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/InterviewAnswerSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/analysis-status:
    get:
      operationId: getAnalysisStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/AnalysisStatusSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/analysis-retry:
    post:
      operationId: retryAnalysis
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [failedStepsOnly]
              additionalProperties: false
              properties:
                failedStepsOnly: { const: true }
      responses:
        '202': { $ref: '#/components/responses/AnalysisStatusSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/report:
    get:
      operationId: getInterviewReport
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/ReportDataSuccess' }
        '202': { $ref: '#/components/responses/ReportProcessingSuccess' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/v1/reports/{reportId}/question-feedback/{feedbackId}/improved-answer-audio:
    get:
      operationId: getImprovedAnswerAudio
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: feedbackId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: voiceType
          in: query
          required: true
          schema: { type: string, enum: [STANDARD, PERSONAL] }
      responses:
        '200':
          description: Improved answer audio stream
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '202': { $ref: '#/components/responses/ReportProcessingSuccess' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/members/me/interview-sessions:
    get:
      operationId: listInterviewHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, IN_PROGRESS, INTERVIEW_COMPLETED, ANALYZING, COMPLETED, INTERRUPTED] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/InterviewHistorySuccess' }
  /api/v1/members/me/growth:
    get:
      operationId: getGrowth
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 5 }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/GrowthSuccess' }
  /api/v1/legal-consents:
    get:
      operationId: listLegalConsents
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ACTIVE, REVOKED], default: ACTIVE }
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LegalDocumentType' }
        - name: sessionId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/LegalConsentPageSuccess' }
    post:
      operationId: createLegalConsent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, actionType]
              additionalProperties: false
              properties:
                documentId: { $ref: '#/components/schemas/Uuid' }
                actionType: { $ref: '#/components/schemas/LegalActionType' }
                context:
                  type: object
                  required: [sessionId]
                  additionalProperties: false
                  properties:
                    sessionId: { type: [string, 'null'], format: uuid }
      responses:
        '200': { $ref: '#/components/responses/LegalConsentSuccess' }
        '201': { $ref: '#/components/responses/LegalConsentSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/legal-consents/{consentRecordId}:
    delete:
      operationId: revokeLegalConsent
      security: [{ bearerAuth: [] }]
      parameters:
        - name: consentRecordId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '202': { $ref: '#/components/responses/LegalConsentRevocationSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/media:
    delete:
      operationId: deleteInterviewMedia
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              additionalProperties: false
              properties:
                scope: { const: ORIGINAL_MEDIA }
      responses:
        '202': { $ref: '#/components/responses/MediaDeletionSuccess' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/media-deletion:
    get:
      operationId: getInterviewMediaDeletion
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/MediaDeletionSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-sessions/{sessionId}/clone:
    post:
      operationId: cloneInterviewSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                growthTaskId: { type: [string, 'null'], format: uuid }
      responses:
        '201': { $ref: '#/components/responses/InterviewSessionSuccess' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/interview-answers/{answerId}/media-access:
    post:
      operationId: createAnswerMediaAccess
      security: [{ bearerAuth: [] }]
      parameters:
        - name: answerId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startMs, endMs]
              additionalProperties: false
              properties:
                startMs: { type: integer, minimum: 0 }
                endMs: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/PlaybackAccessSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/members/me:
    get:
      operationId: getMyMember
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/MemberSummarySuccess' }
    delete:
      operationId: deleteMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              additionalProperties: false
              properties:
                confirmation: { const: DELETE_MY_ACCOUNT }
      responses:
        '202': { $ref: '#/components/responses/MemberDeletionSuccess' }
  /api/v1/members/me/deletion:
    get:
      operationId: getMemberDeletion
      parameters:
        - name: Deletion-Status-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MemberDeletionSuccess' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/voice-profiles:
    post:
      operationId: createVoiceProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [consentLegalRecordId, file]
              properties:
                consentLegalRecordId: { $ref: '#/components/schemas/Uuid' }
                file: { type: string, format: binary }
      responses:
        '202': { $ref: '#/components/responses/VoiceProfileSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/voice-profiles/me:
    get:
      operationId: getMyVoiceProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/VoiceProfileSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteMyVoiceProfile
      security: [{ bearerAuth: [] }]
      responses:
        '202': { $ref: '#/components/responses/VoiceProfileSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/client-events:
    post:
      operationId: createClientEvents
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ClientEvent'
                - type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: '#/components/schemas/ClientEvent' }
      responses:
        '202': { description: Events accepted }
  /api/v1/interview-sessions/{sessionId}/question-context:
    get:
      operationId: getQuestionContext
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/QuestionContextSuccess' }
        '404': { $ref: '#/components/responses/ApiError' }
  /media/v1/playback/{playbackToken}:
    get:
      operationId: streamPlaybackMedia
      parameters:
        - name: playbackToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Full MP4 stream
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '206':
          description: Partial MP4 stream
          headers:
            Content-Range: { schema: { type: string } }
            Accept-Ranges: { schema: { const: bytes } }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '401': { description: Expired or invalid playback token }
components:
