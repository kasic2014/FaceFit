            success: { const: true }
            data: { $ref: '#/components/schemas/AuthData' }
    LegalDocumentType: { type: string, enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, INTERVIEW_MEDIA_PROCESSING, VOICE_CLONING] }
    LegalActionType: { type: string, enum: [CONSENTED, ACKNOWLEDGED] }
    LegalDocumentSummary:
      type: object
      required: [documentId, type, version, title, requiredForOnboarding, requiredAction, effectiveAt]
      additionalProperties: false
      properties:
        documentId: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        version: { type: string }
        title: { type: string }
        requiredForOnboarding: { type: boolean }
        requiredAction: { $ref: '#/components/schemas/LegalActionType' }
