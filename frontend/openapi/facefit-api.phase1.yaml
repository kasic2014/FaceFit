      additionalProperties: false
      properties:
        feedbackId: { $ref: '#/components/schemas/Uuid' }
        questionId: { $ref: '#/components/schemas/Uuid' }
        answerId: { $ref: '#/components/schemas/Uuid' }
        order: { type: integer, minimum: 1 }
        question: { type: string }
        answerSummary: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        evidence: { type: array, items: { $ref: '#/components/schemas/ReportEvidence' } }
        improvedAnswerText: { type: string }
        improvementReason: { type: string }
        audioAvailability:
          type: object
          required: [standard, personal]
          additionalProperties: false
          properties:
            standard: { type: string, enum: [READY, PROCESSING, FAILED] }
            personal: { type: string, enum: [UNAVAILABLE, PROCESSING, READY, FAILED] }
    ReportData:
      type: object
      required: [sessionId, sessionStatus, reportStatus, report]
      additionalProperties: false
      properties:
        sessionId: { $ref: '#/components/schemas/Uuid' }
        sessionStatus: { const: COMPLETED }
        reportStatus: { const: SUCCEEDED }
        report:
          type: object
          required: [reportId, schemaVersion, rubricVersion, overallScore, scores, strengths, improvements, questionFeedback, disclaimer, generatedAt]
          additionalProperties: false
          properties:
            reportId: { $ref: '#/components/schemas/Uuid' }
